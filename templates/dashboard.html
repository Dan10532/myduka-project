{% extends "base.html" %}
{% block title %}Dashboard | MyDuka POS{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="fw-bold text-center mb-4">Dashboard</h2>
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Products</h5>
                    <p class="card-text display-6">{{ total_products }}</p>
                    <a href="/products" class="btn btn-primary btn-sm">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Stock</h5>
                    <p class="card-text display-6">{{ total_stock }}</p>
                    <a href="/stock" class="btn btn-primary btn-sm">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Sales</h5>
                    <p class="card-text display-6">{{ total_sales }}</p>
                    <a href="/sales" class="btn btn-primary btn-sm">View</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Revenue</h5>
                    <p class="card-text display-6">{{ total_revenue }} KSh</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
