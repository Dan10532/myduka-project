<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
 
   <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MyDuka POS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link  active " aria-current="page" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/products">products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/stock">stock</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/sales">sales</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">dashboard</a>
                </li>
            </ul>
        </div>
        
    </nav>

  <!-- Button trigger modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
    insert stock
  </button>

  <!-- Modal -->
  <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="staticBackdropLabel">insert stock</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form action="/add_stock" method="post">
            <div class="mb-3">
              <label for="pid" class="form-label">product id</label>
            <select name="product_id" id="pid">
                {% for product in products %}
                <option value="{{product[0]}}">{{product[1]}}</option>
                 {% endfor %}
              </select>
             

            </div>
            <div class="mb-3">
              <label for="stock_quantity" class="form-label">stock quantity</label>
              <input type="number" class="form-control" id="stock_quantity" name="stock_quantity">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
         
        </div>
      </div>
    </div>
  </div>
  <table class="table">
    <thead>

      <tr>
        <th scope="col">id</th>
        <th scope="col">product id</th>
        <th scope="col">stock_quantity</th>
        <th scope="col">created_at</th>
      </tr>
    </thead>
    <tbody>
      {% for stock in my_stock %}
      <tr>
        <th scope="row">{{stock[0]}}</th>
        <td>{{stock[1]}}</td>
        <td>{{stock[2]}}</td>
        <td>{{stock[3]}}</td>
      </tr>
      {% endfor %}
    </tbody>


  </table>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
